    <link rel="stylesheet" href="style.css">
</head>

<body>

                autoplay
                loop
                muted
                playsinline

            </video>

        </div>


        <!-- Main Text -->
        <h1 id="question">

        <!-- Sub Text -->
        <p id="subText">
            Kitna bhav khaogi? 🥺❤️

        <!-- Buttons -->

            <button id="noBtn" onclick="noClicked()">
                No 🥺
            </button>

        </div>
